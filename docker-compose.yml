services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cia_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cia}
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-cia} -d ${POSTGRES_DB:-cia}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
